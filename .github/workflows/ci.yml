name: Tests and container
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rhythm_test
          POSTGRES_USER: rhythm
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhythm -d rhythm_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://rhythm:ci-only-password@127.0.0.1:5432/rhythm_test?sslmode=disable
      GOTOOLCHAIN: local
    strategy:
      matrix:
        go: ['1.26.x', '1.27.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  go-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL runtime smoke and persistence
        run: |
          export POSTGRES_PASSWORD=$(openssl rand -hex 24)
          export SESSION_SECRET=$(openssl rand -hex 32)
          docker compose config --quiet
          docker compose up --build -d --wait
          curl --fail http://localhost:8081/health
          curl --fail http://localhost:8081/auth | grep '<div id="root">'
          python scripts/smoke_auth.py --phase prepare
          docker compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8081/health; then break; fi
            sleep 1
          done
          python scripts/smoke_auth.py --phase verify
          docker compose exec -T app /app/server -healthcheck
          docker compose stop --timeout 10 app
          test "$(docker inspect --format='{{.State.ExitCode}}' $(docker compose ps -a -q app))" = "0"
          docker compose down -v
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rhythm_test
          POSTGRES_USER: rhythm
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhythm -d rhythm_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://rhythm:ci-only-password@127.0.0.1:5432/rhythm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p12-browser-results
          path: |
            web/playwright-report
            web/test-results
