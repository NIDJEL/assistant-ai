name: Tests and container
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/voice.test.js
      - run: docker compose config --quiet
      - run: docker build -t rhythm-assistant:test .
      - name: Container smoke test
        run: |
          docker run -d --name rhythm-smoke -p 8000:8000 rhythm-assistant:test
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/
          docker logs rhythm-smoke
          docker rm -f rhythm-smoke
