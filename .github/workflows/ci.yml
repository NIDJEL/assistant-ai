name: Tests and container
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
      - name: Check shared corpus against unchanged Python reference
        run: |
          python -m scripts.export_parity
          git diff --exit-code -- testdata/parity/corpus.json internal/search/data/russian.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/voice.test.js
      - run: docker compose -f compose.python.yaml config --quiet
      - run: docker build -f Dockerfile.python -t rhythm-assistant:test .
      - name: Container smoke test
        run: |
          docker run -d --name rhythm-smoke -p 8000:8000 rhythm-assistant:test
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/
          docker logs rhythm-smoke
          docker rm -f rhythm-smoke
  go-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rhythm_test
          POSTGRES_USER: rhythm
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhythm -d rhythm_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://rhythm:ci-only-password@127.0.0.1:5432/rhythm_test?sslmode=disable
    strategy:
      matrix:
        go: ['1.25.x', '1.27.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  go-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL runtime smoke and persistence
        run: |
          export POSTGRES_PASSWORD=$(openssl rand -hex 24)
          export SESSION_SECRET=$(openssl rand -hex 32)
          docker compose -f compose.go.yaml config --quiet
          docker compose up --build -d --wait
          curl --fail http://localhost:8081/health
          curl --fail http://localhost:8081/auth | grep '<div id="root">'
          python scripts/smoke_auth.py --phase prepare
          docker compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8081/health; then break; fi
            sleep 1
          done
          python scripts/smoke_auth.py --phase verify
          docker compose exec -T app /app/server -healthcheck
          docker compose stop --timeout 10 app
          test "$(docker inspect --format='{{.State.ExitCode}}' $(docker compose ps -a -q app))" = "0"
          docker compose down -v
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rhythm_test
          POSTGRES_USER: rhythm
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhythm -d rhythm_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://rhythm:ci-only-password@127.0.0.1:5432/rhythm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p12-browser-results
          path: |
            web/playwright-report
            web/test-results
            docs/screenshots/p1-2
