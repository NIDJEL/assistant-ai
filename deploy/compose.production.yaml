name: rhythm

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
    image: rhythm-app:${RELEASE_TAG:-current}
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rhythm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhythm}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:?Set HTTPS PUBLIC_URL}
      APP_ENV: production
      APP_TIMEZONE: Europe/Moscow
      AUTH_RATE_LIMIT: "20"
      # Nginx on the host overwrites X-Real-IP; Docker forwards it from this gateway.
      TRUSTED_PROXY_CIDRS: "172.30.81.1/32"
      NLP_PROVIDER: rules
      AUTO_IMPORT_DEMO: "false"
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      - /app/var:rw,noexec,nosuid,size=16m,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    networks: [backend]
    logging: *logging
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhythm}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      RHYTHM_DB_USER: ${POSTGRES_USER:-rhythm}
      RHYTHM_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-rhythm.sh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,nosuid,size=16m,uid=999,gid=999
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging
    restart: unless-stopped

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.81.0/24
          gateway: 172.30.81.1

volumes:
  postgres-data:
    name: rhythm-postgres-production
