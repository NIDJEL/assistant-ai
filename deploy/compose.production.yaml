name: rhythm

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
    image: rhythm-app:${RELEASE_TAG:-current}
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rhythm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhythm}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:?Set HTTPS PUBLIC_URL}
      APP_ENV: production
      APP_TIMEZONE: Europe/Moscow
      AUTH_RATE_LIMIT: "20"
      # Nginx on the host overwrites X-Real-IP; Docker forwards it from this gateway.
      TRUSTED_PROXY_CIDRS: "172.30.81.1/32"
      NLP_PROVIDER: rules
      GENA_STT_PROVIDER: ${GENA_STT_PROVIDER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      GROQ_PROXY_URL: ${GROQ_PROXY_URL:-}
      GENA_TTS_PROVIDER: ${GENA_TTS_PROVIDER:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-eastus}
      AZURE_TTS_VOICE: ${AZURE_TTS_VOICE:-ru-RU-DmitryNeural}
      AUTO_IMPORT_DEMO: "false"
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_REDIRECT_URI: ${ZOOM_REDIRECT_URI:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      - /app/var:rw,noexec,nosuid,size=16m,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    networks: [backend]
    logging: *logging
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhythm}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      RHYTHM_DB_USER: ${POSTGRES_USER:-rhythm}
      RHYTHM_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-rhythm.sh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,nosuid,size=16m,uid=999,gid=999
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging
    restart: unless-stopped

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.81.0/24
          gateway: 172.30.81.1

volumes:
  postgres-data:
    name: rhythm-postgres-production
