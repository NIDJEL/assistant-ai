limit_req_zone $binary_remote_addr zone=rhythm_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rhythm_auth:10m rate=10r/m;
limit_req_zone $server_name zone=rhythm_auth_global:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=rhythm_connections:10m;
server_tokens off;

# Do not log query strings, cookies, OAuth codes, or Authorization headers.
log_format rhythm '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name meinangelplatz.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 308 https://meinangelplatz.top$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meinangelplatz.top;
    ssl_certificate /etc/letsencrypt/live/meinangelplatz.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meinangelplatz.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:secp256r1:secp384r1;
    ssl_session_cache shared:rhythm_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn rhythm_connections 30;
    limit_req_status 429;
    access_log /var/log/nginx/rhythm-access.log rhythm;
    error_log /var/log/nginx/rhythm-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;

    location ~ (^|/)\. {
        return 404;
    }
    location ~ ^/(docs|architecture|diagrams|openapi\.json)(/|$) {
        return 404;
    }
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=rhythm_auth burst=5 nodelay;
        limit_req zone=rhythm_auth_global burst=4 nodelay;
        limit_req zone=rhythm_api burst=30 nodelay;
        include /etc/nginx/snippets/rhythm-proxy.conf;
    }
    location /api/ {
        limit_req zone=rhythm_api burst=30 nodelay;
        include /etc/nginx/snippets/rhythm-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/rhythm-proxy.conf;
    }
}
