<polyline points="975,197 1005,197" fill="none" stroke="#718a79" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="565" y="342" width="255" height="98" rx="13" fill="#ffffff" stroke="#dbe5d3"/>
