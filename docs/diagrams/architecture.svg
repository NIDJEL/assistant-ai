<text x="502.5" y="216" text-anchor="middle" font-size="11.4" fill="#778875">Проверка входных данных</text>
<rect x="615" y="140" width="165" height="115" rx="13" fill="#ffffff" stroke="#dbe5d3"/>
<text x="697.5" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#183b3a">Интерпретатор</text>
