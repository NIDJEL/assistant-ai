<rect x="420" y="140" width="165" height="115" rx="13" fill="#ffffff" stroke="#dbe5d3"/>
<text x="502.5" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#183b3a">FastAPI</text>
