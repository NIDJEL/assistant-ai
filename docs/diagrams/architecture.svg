<polyline points="1090,255 1090,342" fill="none" stroke="#718a79" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="880,391 858,391 858,255" fill="none" stroke="#718a79" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="895,140 895,108 307,108 307,140" fill="none" stroke="#718a79" stroke-width="2" marker-end="url(#arrow)"/>
<text x="425" y="102" font-size="12" fill="#628067">Текст ответа и события → озвучивание в браузере</text>
<text x="32" y="502" font-size="13" fill="#778875">SQLite хранится в var/assistant.sqlite3; Docker использует постоянный том rhythm-data.</text>
