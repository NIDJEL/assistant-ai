<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-label="Архитектура Ассистента Гены">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8298bf"/></marker></defs>
<rect width="1200" height="740" rx="24" fill="#f2f7ff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172755"><text x="40" y="52" font-size="30" font-weight="700">Гена: от слов к действию</text>
<text x="40" y="84" font-size="16" fill="#6076a5">React + Go + PostgreSQL · один backend, отдельные провайдеры и устойчивые очереди</text><rect x="40" y="135" width="235" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="157.5" y="169" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">React / TypeScript</text>
<text x="157.5" y="199" text-anchor="middle" font-size="14" fill="#6076a5">Чат, календарь, PWA</text>
<text x="157.5" y="223" text-anchor="middle" font-size="14" fill="#6076a5">Запись и проверка черновика</text><rect x="330" y="135" width="235" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="447.5" y="169" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">Go HTTP API</text>
<text x="447.5" y="199" text-anchor="middle" font-size="14" fill="#6076a5">Сессии, CSRF, validation</text>
<text x="447.5" y="223" text-anchor="middle" font-size="14" fill="#6076a5">Frontend + API</text><rect x="620" y="135" width="235" height="112" rx="16" fill="#0875ff" stroke="#dce8fc"/>
<text x="737.5" y="169" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Ассистент</text>
<text x="737.5" y="199" text-anchor="middle" font-size="14" fill="#fff">Выбор, даты, подтверждение</text>
<text x="737.5" y="223" text-anchor="middle" font-size="14" fill="#fff">Транзакция и request_id</text><rect x="910" y="135" width="250" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="1035" y="169" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">PostgreSQL</text>
<text x="1035" y="199" text-anchor="middle" font-size="14" fill="#6076a5">Дела, диалоги, настройки</text>
<text x="1035" y="223" text-anchor="middle" font-size="14" fill="#6076a5">Сессии и outbox</text><polyline points="275,191 330,191" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="565,191 620,191" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="855,191 910,191" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="340" width="235" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="157.5" y="374" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">Groq STT</text>
<text x="157.5" y="404" text-anchor="middle" font-size="14" fill="#6076a5">Аудио → текст</text>
<text x="157.5" y="428" text-anchor="middle" font-size="14" fill="#6076a5">Только черновик</text><rect x="620" y="340" width="235" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="737.5" y="374" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">GigaChat / Ollama</text>
<text x="737.5" y="404" text-anchor="middle" font-size="14" fill="#6076a5">Текст + компактный контекст</text>
<text x="737.5" y="428" text-anchor="middle" font-size="14" fill="#6076a5">Intent + arguments</text><rect x="910" y="340" width="250" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="1035" y="374" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">Фоновые workers</text>
<text x="1035" y="404" text-anchor="middle" font-size="14" fill="#6076a5">Сроки и повторения</text>
<text x="1035" y="428" text-anchor="middle" font-size="14" fill="#6076a5">CalDAV и push delivery</text><polyline points="447,247 447,290 157,290 157,340" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="157,340 157,315 447,315 447,247" fill="none" stroke="#8298bf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="737,247 737,340" marker-start="url(#arrow)" fill="none" stroke="#8298bf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1035,247 1035,340" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><rect x="620" y="545" width="235" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="737.5" y="579" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">Яндекс Календарь</text>
<text x="737.5" y="609" text-anchor="middle" font-size="14" fill="#6076a5">Односторонняя синхронизация</text>
<text x="737.5" y="633" text-anchor="middle" font-size="14" fill="#6076a5">Из Гены через CalDAV</text><rect x="910" y="545" width="250" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="1035" y="579" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">Web Push</text>
<text x="1035" y="609" text-anchor="middle" font-size="14" fill="#6076a5">Служба браузера → устройство</text>
<text x="1035" y="633" text-anchor="middle" font-size="14" fill="#6076a5">VAPID + service worker</text><polyline points="1035,452 1035,495 737,495 737,545" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1035,452 1035,545" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><text x="40" y="584" font-size="17" font-weight="700">Production runtime</text>
<text x="40" y="615" font-size="15" fill="#6076a5">Go binary + собранный React</text>
<text x="40" y="641" font-size="15" fill="#6076a5">Node.js нужен при сборке</text>
<text x="40" y="702" font-size="14" fill="#6076a5">LLM и CalDAV выполняются вне транзакции изменения дела. Режим правил выбирается явно.</text></g></svg>
