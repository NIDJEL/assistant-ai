<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="03 / Как работает поиск старых записей">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718a79"/></marker></defs>
<rect width="1200" height="420" rx="20" fill="#f7f9f3"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#183b3a">
<text x="32" y="45" font-size="25" font-weight="600">03 / Как работает поиск старых записей</text>
<text x="32" y="74" font-size="14" fill="#778875">Пример: «Найди задачу про контракт с Иваном» находит «Проверить договор с Иваном».</text>
<rect x="30" y="155" width="193" height="115" rx="13" fill="#ffffff" stroke="#dbe5d3"/>
<text x="126.5" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#183b3a">Запрос</text>
<text x="126.5" y="210" text-anchor="middle" font-size="12.0" fill="#778875">Убрать команду и даты</text>
<text x="126.5" y="231" text-anchor="middle" font-size="12.0" fill="#778875">Оставить тему и имя</text>
<rect x="267" y="155" width="193" height="115" rx="13" fill="#ffffff" stroke="#dbe5d3"/>
<text x="363.5" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#183b3a">Словоформы</text>
<text x="363.5" y="210" text-anchor="middle" font-size="12.0" fill="#778875">Иваном → Иван</text>
<text x="363.5" y="231" text-anchor="middle" font-size="12.0" fill="#778875">договору → договор</text>
<rect x="504" y="155" width="193" height="115" rx="13" fill="#ffffff" stroke="#dbe5d3"/>
<text x="600.5" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#183b3a">Смысловые группы</text>
<text x="600.5" y="210" text-anchor="middle" font-size="12.0" fill="#778875">контракт ↔ договор</text>
<text x="600.5" y="231" text-anchor="middle" font-size="12.0" fill="#778875">Презинтация → презентация</text>
<rect x="741" y="155" width="193" height="115" rx="13" fill="#ffffff" stroke="#dbe5d3"/>
<text x="837.5" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#183b3a">Оценка совпадения</text>
<text x="837.5" y="210" text-anchor="middle" font-size="10.4" fill="#778875">Редкие слова имеют больший вес</text>
<text x="837.5" y="231" text-anchor="middle" font-size="9.8" fill="#778875">Порог + устойчивость к опечаткам</text>
<rect x="978" y="155" width="193" height="115" rx="13" fill="#183b3a" stroke="#dbe5d3"/>
<text x="1074.5" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Результаты</text>
<text x="1074.5" y="210" text-anchor="middle" font-size="12.0" fill="#ffffff">Отсортировать по оценке</text>
<text x="1074.5" y="231" text-anchor="middle" font-size="12.0" fill="#ffffff">Показать даты, тип и номер</text>
<polyline points="223,211 267,211" fill="none" stroke="#718a79" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="460,211 504,211" fill="none" stroke="#718a79" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="697,211 741,211" fill="none" stroke="#718a79" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="934,211 978,211" fill="none" stroke="#718a79" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="337" font-size="14" fill="#778875">Поиск включает прошлые и выполненные записи. Фильтр периода применяется только при явном указании.</text>
<text x="32" y="366" font-size="13" fill="#778875">Это морфологический поиск со словарём синонимов. Векторные embeddings можно добавить следующим шагом.</text>
</g></svg>