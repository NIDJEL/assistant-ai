<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 625" role="img" aria-label="Голосовой ввод: запись, Groq, черновик, ручная отправка">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8298bf"/></marker></defs>
<rect width="1200" height="625" rx="24" fill="#f2f7ff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172755"><text x="40" y="52" font-size="30" font-weight="700">Голос становится планом после вашей проверки</text>
<text x="40" y="86" font-size="16" fill="#6076a5">Распознавание создаёт черновик. Команда отправляется только кнопкой или Enter.</text><rect x="40" y="145" width="320" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="200" y="179" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">1. Запись</text>
<text x="200" y="209" text-anchor="middle" font-size="14" fill="#6076a5">getUserMedia + MediaRecorder</text>
<text x="200" y="233" text-anchor="middle" font-size="14" fill="#6076a5">До 2 минут / 15 МиБ</text><rect x="440" y="145" width="320" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="600" y="179" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">2. Транскрипция</text>
<text x="600" y="209" text-anchor="middle" font-size="14" fill="#6076a5">Go → Groq STT</text>
<text x="600" y="233" text-anchor="middle" font-size="14" fill="#6076a5">Аудио обрабатывается в памяти</text><rect x="840" y="145" width="320" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="1000" y="179" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">3. Черновик</text>
<text x="1000" y="209" text-anchor="middle" font-size="14" fill="#6076a5">Проверить и отредактировать</text>
<text x="1000" y="233" text-anchor="middle" font-size="14" fill="#6076a5">Остановка записи не отправляет чат</text><polyline points="360,201 440,201" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="760,201 840,201" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><rect x="840" y="365" width="320" height="112" rx="16" fill="#0875ff" stroke="#dce8fc"/>
<text x="1000" y="399" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4. Отправить / Enter</text>
<text x="1000" y="429" text-anchor="middle" font-size="14" fill="#fff">Явное действие пользователя</text>
<text x="1000" y="453" text-anchor="middle" font-size="14" fill="#fff">Один POST /api/chat</text><rect x="440" y="365" width="320" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="600" y="399" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">5. Проверить и выполнить</text>
<text x="600" y="429" text-anchor="middle" font-size="14" fill="#6076a5">LLM → intent / arguments → Go</text>
<text x="600" y="453" text-anchor="middle" font-size="14" fill="#6076a5">Уточнение или сохранение</text><rect x="40" y="365" width="320" height="112" rx="16" fill="#fff" stroke="#dce8fc"/>
<text x="200" y="399" text-anchor="middle" font-size="19" font-weight="700" fill="#172755">6. Результат</text>
<text x="200" y="429" text-anchor="middle" font-size="14" fill="#6076a5">Ответ и карточки дел</text>
<text x="200" y="453" text-anchor="middle" font-size="14" fill="#6076a5">Календарь и очереди</text><polyline points="1000,257 1000,365" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="840,421 760,421" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="440,421 360,421" fill="none" stroke="#8298bf" stroke-width="2"  marker-end="url(#arrow)"/><text x="40" y="552" font-size="15" fill="#6076a5">При ошибке текст сохраняется. Правка отменяет незавершённое распознавание.</text>
<text x="40" y="581" font-size="15" fill="#6076a5">Отправка отключена во время записи и транскрипции. Автоматического SpeechRecognition fallback нет.</text></g></svg>
